<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>隐私政策</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="wrap">
    <section class="hero">
      <h1>隐私政策</h1>
      <p>本页面用于说明根站与项目站点的基础信息收集与使用方式。</p>
    </section>

    <section class="panel">
      <h2>统计信息</h2>
      <p>站点可能会使用 Google Analytics 等统计服务收集页面访问、设备类型、访问来源等匿名信息，用于改进内容与功能。</p>
    </section>

    <section class="panel">
      <h2>广告服务</h2>
      <p>站点可能会接入 Google AdSense 等广告服务。相关服务可能会根据其自身政策收集广告展示与点击所需的信息。</p>
    </section>

    <section class="panel">
      <h2>用户提交数据</h2>
      <p>工具页中由用户主动提交的宠物名称、身高、体重等信息，仅用于数据整理与后续图鉴补充，不会在未经处理的情况下对外公开展示。</p>
    </section>

    <section class="panel">
      <h2>联系与项目</h2>
      <p>项目仓库：<a href="https://github.com/PUNKDONG/rocegg" target="_blank" rel="noreferrer">https://github.com/PUNKDONG/rocegg</a></p>
      <p><a href="/rocegg/">返回洛克王国查蛋助手</a></p>
    </section>
  </main>
</body>
</html>
